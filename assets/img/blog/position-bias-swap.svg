<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Position-bias answer swap</title>
  <desc id="desc">The same answer X and answer Y appear in opposite A and B positions. Choosing A then B preserves preference for the content of answer X, while choosing A both times favors the first position.</desc>
  <defs>
    <style>
      .title { font: 700 24px system-ui, sans-serif; fill: #182230; }
      .head { font: 700 18px system-ui, sans-serif; fill: #182230; }
      .body { font: 16px system-ui, sans-serif; fill: #344054; }
      .label { font: 700 16px system-ui, sans-serif; fill: #ffffff; }
      .note { font: 600 15px system-ui, sans-serif; fill: #344054; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .x { fill: #3568a8; }
      .y { fill: #a65a3a; }
      .arrow { stroke: #667085; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .good { fill: #e7f6ed; stroke: #61a578; stroke-width: 2; }
      .warn { fill: #fff2e8; stroke: #d4875d; stroke-width: 2; }
    </style>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important}
      .title,.head,.note{fill:#111111}.title{font-size:22px;letter-spacing:-.25px}.body{fill:#222222}.panel{fill:#fff;stroke:#999999;stroke-width:1.5}
      rect[rx]{rx:5px}.x{fill:#0076df}.y{fill:#f92080}.arrow{stroke:#333333;stroke-width:2}.good{fill:#fff;stroke:#0076df}.warn{fill:#fff;stroke:#f92080}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
  </defs>

  <rect width="920" height="430" fill="#ffffff"/>
  <text x="460" y="38" text-anchor="middle" class="title">The answers stay the same; their positions change</text>

  <rect x="50" y="70" width="340" height="205" rx="16" class="panel"/>
  <text x="220" y="104" text-anchor="middle" class="head">Original order</text>
  <rect x="85" y="128" width="270" height="48" rx="10" class="x"/>
  <text x="220" y="159" text-anchor="middle" class="label">Position A · Answer X</text>
  <rect x="85" y="193" width="270" height="48" rx="10" class="y"/>
  <text x="220" y="224" text-anchor="middle" class="label">Position B · Answer Y</text>

  <path d="M405 152 C455 152, 455 217, 505 217" class="arrow"/>
  <path d="M405 217 C455 217, 455 152, 505 152" class="arrow"/>

  <rect x="530" y="70" width="340" height="205" rx="16" class="panel"/>
  <text x="700" y="104" text-anchor="middle" class="head">Reversed order</text>
  <rect x="565" y="128" width="270" height="48" rx="10" class="y"/>
  <text x="700" y="159" text-anchor="middle" class="label">Position A · Answer Y</text>
  <rect x="565" y="193" width="270" height="48" rx="10" class="x"/>
  <text x="700" y="224" text-anchor="middle" class="label">Position B · Answer X</text>

  <rect x="50" y="310" width="390" height="78" rx="14" class="good"/>
  <text x="245" y="340" text-anchor="middle" class="note">Choose A, then B</text>
  <text x="245" y="366" text-anchor="middle" class="body">Same content preferred across positions</text>

  <rect x="480" y="310" width="390" height="78" rx="14" class="warn"/>
  <text x="675" y="340" text-anchor="middle" class="note">Choose A, then A</text>
  <text x="675" y="366" text-anchor="middle" class="body">Different answer preferred: first-position preference</text>
</svg>
