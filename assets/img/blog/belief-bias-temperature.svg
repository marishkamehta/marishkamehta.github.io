<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Overall accuracy and repetition stability across temperatures</title>
  <desc id="desc">Overall accuracy stays near 65 to 67 percent, while repetition stability declines from 99.7 percent at temperature zero to 94.1 percent at temperature one.</desc>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important}
    text[fill="#17202a"],text[fill="#263238"]{fill:#111} text[fill="#52606d"]{fill:#333} [fill="#2468a2"]{fill:#0076df}[fill="#d05a35"]{fill:#f92080} text[fill="#1e5787"]{fill:#0076df}text[fill="#a94527"]{fill:#d60062} line{shape-rendering:crispEdges}
  </style>
  <rect width="920" height="520" fill="#fff"/>
  <text x="460" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17202a">Temperature affected repeatability more than accuracy</text>
  <text x="460" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52606d">Overall results across 366 two-premise problems</text>
  <g stroke="#dfe3e8"><line x1="95" y1="400" x2="820" y2="400"/><line x1="95" y1="320" x2="820" y2="320"/><line x1="95" y1="240" x2="820" y2="240"/><line x1="95" y1="160" x2="820" y2="160"/><line x1="95" y1="80" x2="820" y2="80"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#52606d" text-anchor="end"><text x="82" y="405">60%</text><text x="82" y="325">70%</text><text x="82" y="245">80%</text><text x="82" y="165">90%</text><text x="82" y="85">100%</text></g>
  <line x1="95" y1="400" x2="820" y2="400" stroke="#2f3b45" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#52606d" text-anchor="middle"><text x="95" y="425">0.0</text><text x="240" y="425">0.2</text><text x="385" y="425">0.4</text><text x="530" y="425">0.6</text><text x="675" y="425">0.8</text><text x="820" y="425">1.0</text></g>
  <text x="458" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#263238">Temperature</text>
  <text transform="translate(28 240) rotate(-90)" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#263238">Percentage</text>
  <polyline points="95,348 168,351 240,350 313,353 385,358 458,347 530,360 603,351 675,358 748,358 820,349" fill="none" stroke="#0076df" stroke-width="4"/>
  <polyline points="95,82 168,86 240,89 313,99 385,100 458,106 530,108 603,115 675,118 748,119 820,127" fill="none" stroke="#f92080" stroke-width="4"/>
  <g fill="#2468a2"><circle cx="95" cy="348" r="4"/><circle cx="168" cy="351" r="4"/><circle cx="240" cy="350" r="4"/><circle cx="313" cy="353" r="4"/><circle cx="385" cy="358" r="4"/><circle cx="458" cy="347" r="4"/><circle cx="530" cy="360" r="4"/><circle cx="603" cy="351" r="4"/><circle cx="675" cy="358" r="4"/><circle cx="748" cy="358" r="4"/><circle cx="820" cy="349" r="4"/></g>
  <g fill="#d05a35"><circle cx="95" cy="82" r="4"/><circle cx="168" cy="86" r="4"/><circle cx="240" cy="89" r="4"/><circle cx="313" cy="99" r="4"/><circle cx="385" cy="100" r="4"/><circle cx="458" cy="106" r="4"/><circle cx="530" cy="108" r="4"/><circle cx="603" cy="115" r="4"/><circle cx="675" cy="118" r="4"/><circle cx="748" cy="119" r="4"/><circle cx="820" cy="127" r="4"/></g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700"><text x="830" y="132" fill="#a94527">Repetition</text><text x="830" y="150" fill="#a94527">stability</text><text x="830" y="354" fill="#1e5787">Overall</text><text x="830" y="372" fill="#1e5787">accuracy</text></g>
</svg>
