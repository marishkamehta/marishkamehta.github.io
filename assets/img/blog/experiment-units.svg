<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="650" viewBox="0 0 1050 650" role="img" aria-labelledby="title desc">
  <title id="title">Trials are nested within sessions and experimental units</title>
  <desc id="desc">A condition contains an experimental unit, which completes a session containing several trials. A trial may produce one or more API calls, but those calls are not new independent experimental units.</desc>
  <defs><style>text{font-family:Roboto,Arial,sans-serif;fill:#000}.kicker{font-size:13px;font-weight:500;letter-spacing:1.2px;fill:#b509ac}.title{font-size:27px;font-weight:500}.head{font-size:17px;font-weight:500}.body{font-size:14px}.small{font-size:13px;fill:#222}.inverse{font-size:14px;font-weight:500;fill:#fff}.outer{fill:#fff;stroke:#1c1c1d;stroke-width:2}.inner{fill:#fff;stroke:#555;stroke-width:1.5}.trial{fill:#fff;stroke:#b509ac;stroke-width:2}</style></defs>
  <rect width="1050" height="650" fill="#fff"/>
  <text x="45" y="40" class="kicker">EXPERIMENTAL NESTING</text><text x="45" y="75" class="title">The study design—not the API—defines the observations</text>
  <line x1="45" y1="96" x2="1005" y2="96" stroke="#1c1c1d" stroke-width="2"/>

  <rect x="45" y="125" width="960" height="365" rx="4" class="outer"/>
  <rect x="45" y="125" width="155" height="34" fill="#b509ac"/><text x="60" y="148" class="inverse">CONDITION</text>
  <rect x="90" y="177" width="870" height="270" rx="4" class="inner"/>
  <text x="112" y="207" class="kicker">EXPERIMENTAL UNIT</text><text x="290" y="207" class="small">the unit independently assigned to the condition</text>
  <rect x="135" y="228" width="780" height="177" rx="4" class="inner"/>
  <text x="157" y="258" class="kicker">SESSION</text><text x="245" y="258" class="small">one ordered interaction belonging to this unit</text>
  <rect x="180" y="287" width="200" height="78" rx="4" class="trial"/><text x="280" y="318" text-anchor="middle" class="head">Trial 1</text><text x="280" y="343" text-anchor="middle" class="small">response opportunity</text>
  <rect x="425" y="287" width="200" height="78" rx="4" class="trial"/><text x="525" y="318" text-anchor="middle" class="head">Trial 2</text><text x="525" y="343" text-anchor="middle" class="small">response opportunity</text>
  <rect x="670" y="287" width="200" height="78" rx="4" class="trial"/><text x="770" y="318" text-anchor="middle" class="head">Trial 3</text><text x="770" y="343" text-anchor="middle" class="small">response opportunity</text>
  <text x="525" y="430" text-anchor="middle" class="small">A different study may define a different nesting structure.</text>

  <line x1="525" y1="490" x2="525" y2="525" stroke="#1c1c1d" stroke-width="2"/>
  <rect x="170" y="525" width="710" height="72" rx="4" class="outer"/>
  <text x="195" y="554" class="head">Technical events</text><text x="350" y="554" class="body">A trial may generate an API call, a retry, and a server record.</text>
  <text x="350" y="579" class="body">These events are logged; they are not automatically independent observations.</text>
  <text x="525" y="630" text-anchor="middle" class="kicker">THREE CALLS DO NOT NECESSARILY MEAN THREE EXPERIMENTAL UNITS</text>
</svg>
