<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Accuracy by NeuBAROCO content and temperature</title>
  <desc id="desc">Accuracy on belief-inconsistent problems remains below accuracy on belief-consistent and symbolic problems from temperature zero to one.</desc>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important}
    text[fill="#17202a"],text[fill="#263238"]{fill:#111} text[fill="#52606d"]{fill:#333} [fill="#2468a2"]{fill:#0076df}[fill="#d05a35"]{fill:#f92080}[fill="#21866f"]{fill:#00ab37} text[fill="#1e5787"]{fill:#0076df}text[fill="#a94527"]{fill:#d60062}text[fill="#176b58"]{fill:#00842b} line{shape-rendering:crispEdges}
  </style>
  <rect width="920" height="560" fill="#fff"/>
  <text x="460" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17202a">Belief-inconsistent problems were harder at every temperature</text>
  <text x="460" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52606d">Qwen2.5-3B-Instruct · 366 problems · three responses per problem</text>
  <g stroke="#dfe3e8"><line x1="95" y1="445" x2="820" y2="445"/><line x1="95" y1="355" x2="820" y2="355"/><line x1="95" y1="265" x2="820" y2="265"/><line x1="95" y1="175" x2="820" y2="175"/><line x1="95" y1="85" x2="820" y2="85"/></g>
